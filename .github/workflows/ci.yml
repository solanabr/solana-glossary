name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate
      - run: npm test
      - run: npm pack --dry-run -w @stbr/solana-glossary
      - run: npm run lint -w @stbr/solana-glossary-web
      - run: npm run typecheck -w @stbr/solana-glossary-web
      - run: npm run build -w @stbr/solana-glossary-web
      - run: npm run test -w @stbr/solana-glossary-web
